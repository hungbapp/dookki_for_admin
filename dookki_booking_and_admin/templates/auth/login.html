{% extends "base.html" %}
{% block title %}Đăng nhập - Dookki{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-6 col-lg-5"><div class="card border-0 shadow rounded-4"><div class="card-body p-4 p-md-5">
    <h2 class="text-danger fw-bold text-center mb-4">Đăng nhập</h2>
    <form method="POST" action="{{ url_for('auth.login') }}">
        <div class="mb-3"><label class="form-label">Tên đăng nhập</label><input class="form-control" name="username" autocomplete="username" value="{{ request.form.get('username', '') }}" required autofocus></div>
        <div class="mb-4"><label class="form-label">Mật khẩu</label><input class="form-control" type="password" name="password" autocomplete="current-password" required></div>
        <button class="btn btn-danger w-100 fw-bold" type="submit">Đăng nhập</button>
    </form>
    <p class="text-center mt-3 mb-0">Chưa có tài khoản? <a href="{{ url_for('auth.register') }}">Đăng ký</a></p>
</div></div></div></div>
{% endblock %}
